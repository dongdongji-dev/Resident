# Subagent Agent Framework — 所有参数都在此配置，代码里无隐藏默认值。
# 仅保留 subagent 框架实际引用的段；其余 resident 遗留段一律注释（保留参考备查）。

# ── 运行时 ─────────────────────────────────────────────────────────
# 只读 context_root（context 根目录）、log_level
runtime:
  # name: resident                      # 未引用
  # data_dir: ./data                    # 未引用
  context_root: /home/sandbox/skill_data/subagent   # 引用：hub 注册实例时 session 根目录（每个 session 一个子目录 + session.json 元数据）
  # compressed_dir: ./data/compressed   # 未引用
  log_level: INFO                       # 引用：hub 日志级别
  # log_format: text                    # 未引用

