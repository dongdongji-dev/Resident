# ── LLM 模型配置（多个，spawn/switch_model 时按配置名指定；引用：
#    factory.create_llm_client 用所选 profile 的字段）────────────────
# 每个 profile 是一份完整 llm 配置（protocol/variant/base_url/api_key/model/
# timeout_seconds/retries/options/extra_params/backoff 等）。
llm_profiles:
  default:
    protocol: openai-compatible
    variant: deepseek
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: deepseek-v4-flash
    timeout_seconds: 600
    retries: 2
    retry_delay_seconds: 1.5
    backoff_base: 2.0
    retry_cap_seconds: 60.0
    options:
      reasoning_effort: medium
      max_tokens: 32768
    extra_params: {}
  # OpenCode 09-04 官宣 stealth 匿名模型（设计约定接入实测）
  # 09-05 20:3x 实测确认支持 reasoning_effort（low/medium/high/minimal 都认，
  # 非严格单调），约定默认 medium 控思考长度。
  匿名模型:
    protocol: openai-compatible
    variant: deepseek
    base_url: ${LLM_BASE_URL}
    api_key: ${LLM_API_KEY}
    model: 匿名模型
    timeout_seconds: 600
    retries: 2
    retry_delay_seconds: 1.5
    backoff_base: 2.0
    retry_cap_seconds: 60.0
    options:
      max_tokens: 32768
      reasoning_effort: medium   # 09-05 20:3x 约定默认 medium
    extra_params: {}

# ── 上下文压缩（引用：push_event 后/手动端点触发，只做 step2 无 memory 提取）─
# enabled=false 时 hub 不建压缩 LLM、不自动压缩、手动端点返回未启用。
# max_tokens=窗口上限（上下文 token 总量），threshold=自动触发阈值比例，
#   满足 total > max_tokens*threshold 时自动压缩。
# llm_profile=独立压缩模型（引用上方 llm_profiles 里的某个 profile 名）；
#   不写或留空则复用主 agent 的 LLM。
# 归档：旧 context 备份到 skill_data/subagent/<session>/compressed/（每 session
#   独立，设计约定）。不能配全局路径，必须进 session 领地。
compression:
  enabled: true
  max_tokens: 262144
  threshold: 0.8
  keep_recent_tokens: 16000
  summary_prompt_file: config/prompt/compression_summary.md
  llm_profile: 匿名模型   # 09-05 设计约定：试 匿名模型 做 subagent 上下文压缩
  manual_timeout_s: 180   # 引用：手动压缩（POST /compress）阻塞等待上限（秒）；大上下文可调大

# ── hub：subagent 常驻入口（引用）───────────────────────────────────
# HTTP 监听，管理 agent 实例。端点为：
#   POST /api/agents                      注册实例 {name, system_prompt}
#   GET  /api/agents/<name>/context       读实例 context.jsonl
#   POST /api/agents/<name>/prompt        发 prompt {content}
#   POST /api/agents/<name>/close         关闭实例
hub:
  host: 127.0.0.1
  port: 19711

# ── exec 命令执行工具（引用：workspace_tools.exec）──────────────────
# whitelist: 命令白名单（只填命令名，不含参数；参数不算独立命令）。
#    命令名 = 命令行的第一个词（如 `python3 script.py` → 命令名 python3）。
# approval_timeout_s: exec 审批阻塞最大等待秒数（超时按拒绝处理）。
# 执行前流程：cd 到工作区 → 扫描命令行中所有疑似路径（绝对/相对，URL 除外）
#    逐个用 check_path 校验合法性 → 命令名是否在白名单。全部合规才直接执行；
#    否则触发审批（notice 通知用户），阻塞等待 /api/agents/<name>/approve。
#    被拒绝（或超时）→ 工具返回 403 拒绝码，不执行；框架不 call，仅写上下文。
exec:
  whitelist: [ls, pwd, cat, python3, python, grep, find, head, tail, wc, mkdir, touch, echo]
  approval_timeout_s: 300

# ── workspace 文件工具配置（引用：workspace_tools 的 read/write/edit/...）─
# 所有含 path 参数的工具执行前先 check_path 校验路径是否在工作区内；
# 越界 → 触发审批（与 exec 相同）：approve 放行执行、reject 拒绝(403)。
# 限额变量在此配置，避免代码硬编码（设计约定 设计原则）。
workspace_tools:
  # 安全删除（delete 工具）的回收站目录：文件移入此处而非真删，
  # 重名自动加时间戳后缀（2026-09-05 设计约定"堵不如疏"）。
  trash_dir: /home/sandbox/trash
  read_max_bytes: 65535
  read_max_lines: 1000
  read_warn_bytes: 32768
  read_default_line_numbers: true
  glob_max_results: 100
  grep_head_limit: 250
  grep_max_columns: 500
  edit_max_old_chars: 20000
  edit_output_max_chars: 20000
  write_max_bytes: 262144
  exec_default_timeout_s: 60