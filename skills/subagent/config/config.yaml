# ── 完成/审批通知回推（引用：hub._default_notice_hook → POST core /api/notice）─
# url=core 的 notice 端点（清代理直连 host.docker.internal）；timeout_s=单次请求
#   阻塞上限（秒，原代码硬编码 6 → 09-16 按"变量进配置"原则下沉）。
notice:
  url: http://host.docker.internal:18086/api/notice
  timeout_s: 6

# ── agent：框架行为参数（hub 的 AgentManager 读取）──────────────────
agent:
  tool_timeout_seconds: 300              # 引用：工具执行总超时（hub → Agent）
  event_batch_wait_seconds: 0.5         # 引用：idle 见事件后批等待
  repair_latest_n: 5                    # 引用：每轮前修复 context 尾 N 条
  user_merge:                           # 引用：user 消息合并
    enabled: true
    separator: "\n\n---\n\n"
    notice: "[系统提示] 以下为本次批内合并的多条消息，请注意逐条回应。"
  # model_output_threshold_chars: 800             # 未引用（resident 自说自话检测）
  # model_output_line_max_chars: 100              # 未引用
  # unread_window_hours: 1                        # 未引用（resident 未读统计）
  # unread_max_per_session: 99                    # 未引用
  # llm_failed_backoff_seconds: 2.0               # 未引用

